# Publication automatique : à chaque envoi sur main, si le numéro de version de
# src/app.py (VERSION = "0.xx") n'a pas encore de release, GitHub fabrique
# HFImage_F4GOP.exe sous Windows et crée la release vX.YY avec les nouveautés
# tirées de CHANGELOG.md. Les programmes HFImage ouverts (0.20 et plus) proposent
# alors la mise à jour par le bandeau.
# Ensuite, le travail « win7 » fabrique HFImage_F4GOP_Win7.exe (Python 3.8, pour Windows 7 / 8)
# et l'ajoute à la même release ; s'il échoue, la version normale n'est pas touchée.
# Le travail « linux » fabrique HFImage_F4GOP_Linux.tar.gz (Ubuntu 22.04 : glibc 2.35, marche sur
# Ubuntu 22.04+, Debian 12+, Mint 21+…), avec codec2 et HamDRM compilés depuis leurs sources.
name: Release

on:
  push:
    branches: [main]
    paths: ["src/**", "CHANGELOG.md", ".github/**", "requirements-build*.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 -oP '^VERSION = "\K[0-9.]+' src/app.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
            echo "La release v$v existe déjà : rien à faire."
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'no'
        with:
          python-version: "3.12"

      - name: Dépendances
        if: steps.ver.outputs.exists == 'no'
        run: python -m pip install -r requirements-build.txt

      - name: Tests (sécurité de la réception)
        if: steps.ver.outputs.exists == 'no'
        shell: bash
        run: |
          # en cas d'échec, les tests en défaut sont affichés en annotations (lisibles sans le journal)
          if ! python -m unittest discover -s tests -v > tests.log 2>&1; then
            cat tests.log
            grep -E "^(FAIL|ERROR):|Error:|assert" tests.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          tail -5 tests.log

      - name: Fabrication de l'exe
        if: steps.ver.outputs.exists == 'no'
        working-directory: src
        run: pyinstaller --noconfirm HFImage.spec

      - name: Autotest
        if: steps.ver.outputs.exists == 'no'
        working-directory: src
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\HFImage_F4GOP.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.txt" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "autotest trop long" }
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          $r = (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "DATAC|HamDRM|RÉSULTAT" | ForEach-Object { $_.Line }) -join " | "
          echo "::notice::Autotest : $r"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "DATAC1X: .* -> OK" -Quiet)) { throw "modems en échec" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "HamDRM \(EasyPal\): .* -> OK" -Quiet)) { throw "mode EasyPal (hamdrm.dll) en échec" }

      - name: Nouveautés (CHANGELOG.md)
        if: steps.ver.outputs.exists == 'no'
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## Version " v "( |$)" {on=1; title=$0; sub(/^## /, "", title); print title > "title.txt"; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s title.txt ] || echo "Version $v" > title.txt
          [ -s notes.md ] || echo "HFImage F4GOP $v" > notes.md
          cat title.txt notes.md

      - name: Création de la release
        if: steps.ver.outputs.exists == 'no'
        shell: bash
        run: |
          if ! out=$(gh release create "${{ steps.ver.outputs.tag }}" src/dist/HFImage_F4GOP.exe \
                --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md --latest 2>&1); then
            echo "::error::gh release create : $(echo "$out" | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"
        env:
          GH_TOKEN: ${{ github.token }}

  win7:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Faut-il fabriquer la version Windows 7 ?
        id: w7
        shell: bash
        run: |
          v=$(grep -m1 -oP '^VERSION = "\K[0-9.]+' src/app.py)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$v" >/dev/null 2>&1; then
            echo "todo=no" >> "$GITHUB_OUTPUT"; echo "Pas de release v$v."
          elif gh release view "v$v" --json assets --jq '.assets[].name' | grep -qx 'HFImage_F4GOP_Win7.exe'; then
            echo "todo=no" >> "$GITHUB_OUTPUT"; echo "HFImage_F4GOP_Win7.exe déjà présent."
          else
            echo "todo=yes" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.w7.outputs.todo == 'yes'
        with:
          python-version: "3.8"
          architecture: x64

      - name: Dépendances (Python 3.8)
        if: steps.w7.outputs.todo == 'yes'
        run: python -m pip install -r requirements-build-win7.txt

      - name: Variante Windows 7 + CRT universelle embarquée
        if: steps.w7.outputs.todo == 'yes'
        working-directory: src
        shell: pwsh
        run: |
          "LEGACY = True" | Set-Content -Encoding ascii buildinfo.py
          $k = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist"
          $d = Get-ChildItem -Path $k -Recurse -Directory -Filter x64 -ErrorAction SilentlyContinue |
               Where-Object { $_.FullName -match '\\ucrt\\DLLs\\x64$' } | Select-Object -First 1
          if ($d) {
            New-Item -ItemType Directory -Force ucrt | Out-Null
            Copy-Item "$($d.FullName)\*.dll" ucrt\
            echo "CRT universelle : $((Get-ChildItem ucrt).Count) fichiers depuis $($d.FullName)"
          } else { echo "::warning::CRT universelle introuvable dans le SDK : non embarquée" }

      - name: Fabrication de l'exe Windows 7
        if: steps.w7.outputs.todo == 'yes'
        working-directory: src
        run: pyinstaller --noconfirm HFImage.spec

      - name: Contrôle des fonctions Windows 8+
        if: steps.w7.outputs.todo == 'yes'
        working-directory: src
        run: python ..\.github\scripts\win7check.py build\HFImage\Analysis-00.toc

      - name: Autotest
        if: steps.w7.outputs.todo == 'yes'
        working-directory: src
        shell: pwsh
        run: |
          Rename-Item dist\HFImage_F4GOP.exe HFImage_F4GOP_Win7.exe
          $p = Start-Process -FilePath dist\HFImage_F4GOP_Win7.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.txt" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "autotest trop long" }
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "DATAC1X: .* -> OK" -Quiet)) { throw "modems en échec" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "HamDRM \(EasyPal\): .* -> OK" -Quiet)) { throw "mode EasyPal (hamdrm.dll) en échec" }

      - name: Ajout à la release
        if: steps.w7.outputs.todo == 'yes'
        shell: bash
        run: gh release upload "${{ steps.w7.outputs.tag }}" src/dist/HFImage_F4GOP_Win7.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Faut-il fabriquer la version Linux ?
        id: lx
        shell: bash
        run: |
          v=$(grep -m1 -oP '^VERSION = "\K[0-9.]+' src/app.py)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$v" >/dev/null 2>&1; then
            echo "todo=no" >> "$GITHUB_OUTPUT"; echo "Pas de release v$v."
          elif gh release view "v$v" --json assets --jq '.assets[].name' | grep -qx 'HFImage_F4GOP_Linux.tar.gz'; then
            echo "todo=no" >> "$GITHUB_OUTPUT"; echo "HFImage_F4GOP_Linux.tar.gz déjà présent."
          else
            echo "todo=yes" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Paquets système
        if: steps.lx.outputs.todo == 'yes'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb cmake g++

      - name: codec2 (avec le mode DATAC1X de HFImage)
        if: steps.lx.outputs.todo == 'yes'
        shell: bash
        run: |
          git clone -q https://github.com/drowe67/codec2.git "$RUNNER_TEMP/codec2"
          cd "$RUNNER_TEMP/codec2"
          git checkout -q 310777b1c6f1af0bc7c72f5b32f80f6fd9136962
          cp "$GITHUB_WORKSPACE/codec2_patch/hfi_modes.c" src/
          git apply "$GITHUB_WORKSPACE/codec2_patch/CMakeLists.patch"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release > /dev/null
          make -j"$(nproc)" codec2 > /dev/null
          cp -L src/libcodec2.so "$GITHUB_WORKSPACE/src/libcodec2.so"

      - name: HamDRM (mode EasyPal)
        if: steps.lx.outputs.todo == 'yes'
        run: sh hamdrm/build_standalone.sh linux "$GITHUB_WORKSPACE/src"

      - uses: actions/setup-python@v5
        if: steps.lx.outputs.todo == 'yes'
        with:
          python-version: "3.12"

      - name: Dépendances
        if: steps.lx.outputs.todo == 'yes'
        run: python -m pip install -r requirements-build-linux.txt

      - name: Tests sous Linux
        if: steps.lx.outputs.todo == 'yes'
        shell: bash
        run: |
          export CODEC2_LIB="$GITHUB_WORKSPACE/src/libcodec2.so"
          if ! xvfb-run -a python -m unittest discover -s tests -v > tests.log 2>&1; then
            cat tests.log
            grep -E "^(FAIL|ERROR):|Error:|assert" tests.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          tail -5 tests.log

      - name: Fabrication du programme Linux
        if: steps.lx.outputs.todo == 'yes'
        working-directory: src
        run: pyinstaller --noconfirm HFImage.spec

      - name: Autotest
        if: steps.lx.outputs.todo == 'yes'
        working-directory: src
        shell: bash
        run: |
          set +e
          timeout 600 xvfb-run -a dist/HFImage_F4GOP_Linux --selftest "$RUNNER_TEMP/selftest.txt" > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          set -e
          echo "::notice::Autotest Linux : code de sortie $code"
          tail -c 1500 "$RUNNER_TEMP/out.txt" | tr '\n' '|' | sed 's/^/::warning::sortie : /'; echo
          [ -f "$RUNNER_TEMP/selftest.txt" ] || { echo "::error::pas de rapport d'autotest"; exit 1; }
          cat "$RUNNER_TEMP/selftest.txt"
          echo "::notice::Autotest Linux : $(grep -E 'DATAC|HamDRM|RÉSULTAT' "$RUNNER_TEMP/selftest.txt" | tr '\n' '|')"
          grep -q "DATAC1X: .* -> OK" "$RUNNER_TEMP/selftest.txt" || { echo "::error::modems en échec"; exit 1; }
          grep -q "HamDRM (EasyPal): .* -> OK" "$RUNNER_TEMP/selftest.txt" || { echo "::error::HamDRM en échec"; exit 1; }
          grep -q "PortAudio : PortAudio" "$RUNNER_TEMP/selftest.txt" || { echo "::error::PortAudio absent"; exit 1; }

      - name: Ajout à la release
        if: steps.lx.outputs.todo == 'yes'
        shell: bash
        run: |
          cd src/dist
          tar czf HFImage_F4GOP_Linux.tar.gz HFImage_F4GOP_Linux
          gh release upload "${{ steps.lx.outputs.tag }}" HFImage_F4GOP_Linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
